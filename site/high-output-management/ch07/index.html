/* Colours: amber = a fixed point / the limiting step and the rule; blue = ordinary work; red = cost, waste or a problem; green = the goal. */
function l7Person(p, x, y, color, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('circle', { cy: -22, r: 16, fill: color }, g);
  path(g, 'M-28 26C-28 0 -14 -4 0 -4C14 -4 28 0 28 26Z', { fill: color, stroke: 'none' });
  return g;
}
const l7Chip = (p, s, x, y, color, t0, w) => {
  const g = G(p, { o: 0 }); mk('rect', { x: x - w / 2, y: y - 24, width: w, height: 48, rx: 24, fill: '#16211d', stroke: color, 'stroke-width': 2.5 }, g);
  T(g, s, { x, y: y + 9, size: 24, fill: color, anchor: 'middle' }); show(g, t0); return g;
};
// A block on a week grid: day 0–4, hours from 9 (start, end), inside a grid at (x0, y0) with column width cw and px per hour ph.
function l7Block(p, grid, day, h0, h1, fill, t0, label, o = {}) {
  const { x0, y0, cw, ph } = grid, x = x0 + day * cw + 4, y = y0 + (h0 - 9) * ph + 2;
  const g = G(p, { o: 0 });
  mk('rect', { x, y, width: cw - 8, height: (h1 - h0) * ph - 4, rx: 6, fill, stroke: o.stroke || 'none', 'stroke-width': 2 }, g);
  if (label) T(g, label, { x: x + (cw - 8) / 2, y: y + (h1 - h0) * ph / 2 + 7, size: o.size || 20, fill: o.ink || COL.board, weight: 600, anchor: 'middle' });
  if (o.drop) { put(g, { y: -60 }); tw(g, { y: 0, o: 1 }, t0, .5, out); } else show(g, t0);
  return g;
}
function l7Grid(p, grid, t0, { days = true, hours = true } = {}) {
  const { x0, y0, cw, ph } = grid;
  for (let d = 0; d <= 5; d++) path(p, `M${x0 + d * cw} ${y0}V${y0 + 8 * ph}`, { stroke: COL.faint, 'stroke-width': 1.5 });
  for (let h = 0; h <= 8; h += 2) path(p, `M${x0} ${y0 + h * ph}H${x0 + 5 * cw}`, { stroke: COL.faint, 'stroke-width': 1.5 });
  if (days) ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].forEach((s, d) => hmSay(p, s, x0 + d * cw + cw / 2, y0 - 14, t0, { size: 20, fill: COL.dim }));
  if (hours) [[0, '9'], [2, '11'], [4, '1'], [6, '3'], [8, '5']].forEach(([h, s]) => hmSay(p, s, x0 - 12, y0 + h * ph + 7, t0, { size: 18, fill: COL.dim, anchor: 'end' }));
}

    hmSay(p, 'smooth your own load where you can', 800, 380, m('smooth'), { size: 26, fill: COL.dim });

    const bx = G(p, { o: 0 });
    mk('rect', { x: 230, y: 430, width: 340, height: 180, rx: 14, fill: '#121a17', stroke: COL.faint, 'stroke-width': 4 }, bx);
    mk('rect', { x: 330, y: 470, width: 140, height: 100, rx: 8, fill: '#26362f', stroke: COL.chalk, 'stroke-width': 3 }, bx);
    mk('circle', { cx: 400, cy: 528, r: 22, fill: COL.bad }, bx); path(bx, 'M412 510Q426 490 440 494', { stroke: COL.task, 'stroke-width': 3, fill: 'none' });
    show(bx, m('bomb'));
    hmSay(p, 'see the time bomb early', 400, 650, m('bomb', .5), { size: 24, fill: COL.bad, weight: 600 });
    const GR = { x0: 900, y0: 460, cw: 100, ph: 18 };
    l7Grid(p, GR, m('mon'), { hours: false });
    l7Block(p, GR, 0, 9, 13, COL.whole, m('mon', .5), '', {});
    hmLines(p, ['Monday mornings:', 'planning groups, company-wide'], 1150, 640, m('mon', .8), { size: 22, fill: COL.whole, weight: 600 });
    hmRule(p, 'Same blocks of time for the same kind of work.', m('mon', 5), 745);
  }],

  ['interrupt', 'Interruptions', (m) => {
    const p = panel(0);
    hmHead(p, 'The plague of managerial work');
    const you = l7Person(p, 800, 420, COL.chalk); show(you, .3);
    const tt = m('top');
    [[300, 250], [300, 420], [300, 590], [1300, 250], [1300, 420], [1300, 590], [600, 200], [1000, 200]].forEach(([x, y], i) => hmArrow(p, x, y, x < 800 ? 740 : 860, 400 + (y - 420) * .25, COL.bad, tt + i * .15, .4));
    hmSay(p, 'uncontrolled interruptions', 800, 168, tt + 1.2, { size: 28, fill: COL.bad, weight: 700 });
    hmLines(p, ['your', 'reports'], 200, 410, m('who'), { size: 24, fill: COL.dim });
    hmLines(p, ['users of your', 'authority and', 'information'], 1420, 390, m('who', 1.5), { size: 24, fill: COL.dim });
    const door = mk('rect', { x: 740, y: 460, width: 120, height: 0, rx: 4, fill: '#3b4f47', stroke: COL.dim, 'stroke-width': 3 }, p);
    put(door, { a_y: 460, a_height: 0 }); tw(door, { a_y: 350, a_height: 120 }, m('hide'), .5);
    hmSay(p, 'hide?', 800, 520, m('hide', .4), { size: 26, fill: COL.dim });
    for (let i = 0; i < 10; i++) { const d = hmDot(p, 690 - (i % 5) * 26, 580 - Math.floor(i / 5) * 26, COL.bad, 11); show(d, m('no', 1 + i * .2), .2); }
    hmSay(p, 'problems pile up', 600, 640, m('no', 2.5), { size: 24, fill: COL.bad, weight: 600 });
    hmRule(p, 'Interrupters have real problems. Hiding just piles them up.', m('no', 4.5), 745);
  }],

  ['fixes', 'Channel the interruptions', (m) => {
    const p = panel(0);
    hmHead(p, 'Turn interruptions into a pattern');
    hmBox(p, 240, 270, 340, 140, COL.whole, m('std'), 'Standard answers', { size: 26, sub: ['others can give them too'] });
    hmBox(p, 610, 270, 340, 140, COL.whole, m('batch'), 'Batch them', { size: 26, sub: ['in 1:1s and staff meetings'] });
    hmBox(p, 980, 270, 340, 140, COL.whole, m('arch'), 'Indicators on file', { size: 26, sub: ['answers in seconds'] });
    hmBox(p, 1350, 270, 340, 140, COL.whole, m('sign'), 'A sign + office hour', { size: 26, sub: ['they decide: can it wait?'] });
    const sg = G(p, { o: 0 });
    mk('rect', { x: 480, y: 420, width: 640, height: 120, rx: 10, fill: '#ece8dc' }, sg);
    T(sg, 'Doing individual work. Please don’t interrupt', { x: 800, y: 470, size: 24, fill: COL.board, weight: 600, anchor: 'middle' });
    T(sg, 'unless it really can’t wait until 2:00.', { x: 800, y: 506, size: 24, fill: COL.board, weight: 600, anchor: 'middle' });
    show(sg, m('sign', 1));
    l7Chip(p, '2:00 · open office hour, fully available', 800, 610, COL.good, m('hour'), 520);
    hmRule(p, 'Make the irregular regular.', m('reg'), 745);
  }],

  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    hmSay(p, 'Lesson 7 in five lines', 800, 120, .2, { size: 40, weight: 600 });
    hmWrap(p, [['Plan around fixed points; batch similar work.', 'w1'], ['Your calendar is a production plan. Say no early.', 'w2'], ['Leave slack, and keep a stock of projects.', 'w3'], ['Six to eight reports, about half a day a week each.', 'w4'], ['Channel interruptions into set times and standard answers.', 'w5']], m);
  }],

  ['final1', 'Lesson practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [
    { id: 'p-fixed', prompt: ['Your quarterly business review is fixed for Thursday at nine. Preparing it takes two afternoons. What do you do first?'],
      build: choice([['Block the two prep afternoons now, working back from Thursday'], ['Prepare on Wednesday night'], ['Prepare whenever gaps appear']], 0,
        'The review is the limiting step. Offset the prep before it, then fit the rest around both.',
        [null, 'That leaves no room for a surprise, and squeezes everything else.', 'Gaps rarely appear on their own. Plan them in.']) },
    { id: 'p-cal', prompt: ['Your calendar fills up with whatever invitations people send. What does Grove suggest?'],
      build: choice([['Accept them all: that is the job'], ['Set the fixed events, then schedule your own work into the gaps'], ['Decline every meeting you did not call']], 1,
        'Use the calendar as a production plan, not a passive list of incoming orders.',
        ['That is the job-shop habit Grove calls mindless passivity.', null, 'Many meetings are high-leverage. The point is to plan, not to refuse.']) },
    { id: 'p-slack', prompt: ['You are booked solid from eight to six, every day this week. What is the main risk?'],
      build: choice([['One unexpected call wrecks the rest of the day'], ['You will run out of work'], ['There is none: full means productive']], 0,
        'Like a freeway past its best load, a few extra demands bring everything to a halt.',
        [null, 'The opposite: there is no room for anything new.', 'Past the ideal load, output falls, it does not rise.']) },
    { id: 'p-span', prompt: ['A director has twelve direct reports and cannot keep up. What does Grove’s rule of thumb say?'],
      build: choice([['Twelve is fine if she works longer hours'], ['Too many: at half a day each, twelve would take six days a week'], ['Too few to give her real leverage']], 1,
        'Half a day per person, per week, is what supervision needs. Six to eight fit in a week.',
        ['Longer hours do not change the arithmetic, and the risk is too little monitoring.', null, 'Twelve is above the six-to-eight range, not below it.']) },
    { id: 'p-int', prompt: ['Your team interrupts you all day with similar questions. What is the best first step?'],
      build: choice([['Work from home to get away from them'], ['Write standard answers to the repeat questions, and batch the rest into one-on-ones'], ['Ask them to stop bringing you questions']], 1,
        'Standard answers handle the repeats, and others can give them. Batching turns the rest into a regular pattern.',
        ['Hiding leaves real problems to pile up.', null, 'Their problems are legitimate. Channel them; do not block them.']) },
  ], done, 'Lesson practice') }],

  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
boot();
