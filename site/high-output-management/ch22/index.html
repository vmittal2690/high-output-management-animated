/* Colours: pink = competence-driven (mastery); purple = achievement-driven, and money as a measure of it;
   salmon = money as a need; blue = ordinary work and training; green = the goal or a good result;
   red = a problem; amber = the rule. */
function l22Person(p, x, y, color, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('circle', { cy: -22, r: 16, fill: color }, g);
  path(g, 'M-28 26C-28 0 -14 -4 0 -4C14 -4 28 0 28 26Z', { fill: color, stroke: 'none' });
  return g;
}
const l22Chip = (p, s, x, y, color, t0, w, size = 24) => {
  const g = G(p, { o: 0 }); mk('rect', { x: x - w / 2, y: y - 24, width: w, height: 48, rx: 24, fill: '#16211d', stroke: color, 'stroke-width': 2.5 }, g);
  T(g, s, { x, y: y + 8, size, fill: color, anchor: 'middle' }); show(g, t0); return g;
};
// A peg standing on the floor line at (x, floor).
function l22Peg(p, x, floor, t0) {
  const g = G(p, { o: 0 });
  path(g, `M${x} ${floor}V${floor - 60}`, { stroke: COL.chalk, 'stroke-width': 6 });
  mk('ellipse', { cx: x, cy: floor, rx: 22, ry: 6, fill: COL.faint }, g);
  show(g, t0); return g;
}
const l22Ring = (p, x, y, color, t0) => { const r = G(p, { x, y, o: 0 }); mk('ellipse', { rx: 20, ry: 7, fill: 'none', stroke: color, 'stroke-width': 4 }, r); show(r, t0); return r; };

    hmBox(p, 1280, 300, 420, 150, COL.good, m('player'), 'Knows the game', { size: 28, fill: COL.good, sub: ['was a good player once'] });
    const f = G(p, { o: 0 });
    mk('rect', { x: 500, y: 450, width: 600, height: 200, rx: 10, fill: 'none', stroke: COL.dim, 'stroke-width': 3 }, f);
    path(f, 'M800 450V650', { stroke: COL.dim, 'stroke-width': 2 });
    mk('circle', { cx: 800, cy: 550, r: 40, fill: 'none', stroke: COL.dim, 'stroke-width': 2 }, f);
    show(f, m('field'));
    [600, 690, 910, 1000].forEach((x, i) => show(l22Person(p, x, i % 2 ? 590 : 530, COL.real, .7), m('field', .8 + i * .2)));
    hmRule(p, 'Be the coach: no credit, high standards, know the game.', m('field', 4), 745);
  }],

  ['q4', 'Quick check', () => { panel(0); }, { ask: done => quiz(MID, [{
    id: 'c-coach', prompt: ['Your team files a key regulatory submission early. At the all-hands, what would a good coach do? (illustrative)'],
    build: choice([['Present it as the result of his own plan'], ['Credit the team, then push on what could be sharper next time'], ['Skip any critique: they did well']], 1,
      'A coach takes no personal credit, and stays tough to get the best next time.',
      ['Taking the credit costs the players’ trust.', null, 'A good coach is critical even after a win, to raise the level.']),
  }], done) }],

  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    hmSay(p, 'Lesson 22 in five lines', 800, 120, .2, { size: 40, weight: 600 });
    hmWrap(p, [['Achievers work at the edge of their ability.', 'w1'], ['Set objectives at fifty-fifty; value output.', 'w2'], ['Money as a need runs out; as a measure, never.', 'w3'], ['Give task-relevant feedback; don’t punish misses.', 'w4'], ['Give work a racetrack, and be the coach.', 'w5']], m);
  }],

  ['final1', 'Lesson practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [
    { id: 'p-fifty', prompt: ['You are setting next quarter’s objectives for a clinical data team. How hard should they be?'],
      build: choice([['Easy enough to be sure of hitting them all'], ['Hard enough that a real push gives about even odds'], ['As high as possible, to show ambition']], 1,
        'Fifty-fifty objectives get the most output, even though half are missed.',
        ['Sure things leave people short of their best.', null, 'Out-of-reach goals bring no satisfaction and teach people to give up.']) },
    { id: 'p-raise', prompt: ['Two engineers get the same raise. One is pleased; the other is upset to learn a peer got more. What does that tell you?'],
      build: choice([['The upset one cares about the money itself'], ['The upset one treats money as a measure of achievement'], ['Nothing: raises never motivate']], 1,
        'Caring how a raise compares, not its size, shows esteem or self-actualization at work.',
        ['Caring about the dollars themselves points to the lower needs, not to comparison.', null, 'Money as a measure motivates without limit.']) },
    { id: 'p-czar', prompt: ['Quality of device-history records is mediocre at three sites, and reminders haven’t helped. A Grove-style fix?'],
      build: choice([['Pay a bonus for good records'], ['Have a senior person score each site regularly and compare the scores'], ['Send more reminders, signed by a vice president']], 1,
        'Like the building czars: a racetrack, with no extra money, lifted every building.',
        ['Grove’s buildings improved with no money or rewards at all.', null, 'More pressure had already failed, as it did for Intel’s maintenance group.']) },
    { id: 'p-office', prompt: ['A strong engineer asks for a corner office as recognition for her work. What does Grove advise?'],
      build: choice([['Give it: any reward helps'], ['Steer recognition toward task-relevant feedback and results'], ['Refuse and say nothing more']], 1,
        'Office size is an irrelevant reward. Tie recognition to her performance and its effect on the organization.',
        ['Irrelevant rewards point the drive at the wrong target.', null, 'She still needs recognition, just the relevant kind.']) },
    { id: 'p-miss', prompt: ['Your team missed an ambitious objective you set at fifty-fifty. How should you treat it?'],
      build: choice([['Lower the targets next quarter'], ['As expected some of the time: review it and keep stretching'], ['Mark it as a failure in their reviews']], 1,
        'In sport, half of all matches are lost. A miss on a stretch goal is part of playing at the limit.',
        ['Lower targets give up the extra output.', null, 'Punishing misses breeds the fear that makes achievers play safe.']) },
  ], done, 'Lesson practice') }],

  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
boot();
</script>
