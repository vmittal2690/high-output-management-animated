<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What gets in the way, and the six questions</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/book.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 11, title: 'What gets in the way, and the six questions', kicker: 'Part 3 · Lesson 2', minutes: 12, language: 'en', silent: true, next: '../ch12/index.html' };

/* Colours: blue = peers and ordinary work; purple = the senior person / position power; green = the goal; red = a problem; amber = the rule. */
function l11Person(p, x, y, color, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('circle', { cy: -22, r: 16, fill: color }, g);
  path(g, 'M-28 26C-28 0 -14 -4 0 -4C14 -4 28 0 28 26Z', { fill: color, stroke: 'none' });
  return g;
}
const l11Chip = (p, s, x, y, color, t0, w, size = 24) => {
  const g = G(p, { o: 0 }); mk('rect', { x: x - w / 2, y: y - 24, width: w, height: 48, rx: 24, fill: '#16211d', stroke: color, 'stroke-width': 2.5 }, g);
  T(g, s, { x, y: y + 8, size, fill: color, anchor: 'middle' }); show(g, t0); return g;
};
const L11_Q = ['What decision?', 'When?', 'Who decides?', 'Who is consulted?', 'Who ratifies or vetoes?', 'Who is told?'];

const BEATS = [
  ['intro', 'What gets in the way, and the six questions', (m, D) => hmTitle(m, D, 'Part 3 · Deciding and planning · Lesson 2 of 4', 'What gets in the way', 'And six questions that clear the path to a decision')],

  ['emotions', 'Emotions', (m) => {
    const p = panel(0);
    hmHead(p, 'Every decision comes with emotions');
    [['pride', 380], ['ambition', 640], ['fear', 900], ['insecurity', 1180]].forEach(([s, x], i) => l11Chip(p, s, x, 260, COL.bad, m('list', i * .5), 200));
    [[520, COL.whole], [660, COL.whole], [940, COL.nat], [1080, COL.nat]].forEach(([x, c], i) => { const q = l11Person(p, x, 450, c); show(q, m('new', i * .15)); });
    hmSay(p, 'team A', 590, 520, m('new', .4), { size: 22, fill: COL.whole }); hmSay(p, 'team B', 1010, 520, m('new', .6), { size: 22, fill: COL.nat });
    hmSay(p, 'deciding together for the first time', 800, 590, m('new', 1.5), { size: 26, fill: COL.dim });
    hmRule(p, 'Emotions surface fastest among people new to each other.', m('new', 4), 745);
  }],

  ['roleplay', 'Peer-plus-one', (m) => {
    const p = panel(0);
    hmHead(p, 'Intel’s first management training role-play');
    const tb = mk('ellipse', { cx: 700, cy: 380, rx: 220, ry: 90, fill: '#16211d', stroke: COL.faint, 'stroke-width': 3 }, p); put(tb, { o: 0 }); show(tb, .3);
    [[540, 280], [700, 260], [860, 280], [540, 490], [700, 510], [860, 490]].forEach(([x, y], i) => { const q = l11Person(p, x, y, COL.whole, .8); show(q, .4 + i * .06); });
    const ch = l11Person(p, 960, 380, COL.real); show(ch, .5);
    hmSay(p, 'chairman, one level up', 1000, 440, .5, { size: 20, fill: COL.real, anchor: 'start' });
    tw(ch, { x: 1340 }, m('out'), 1, io);
    const door = mk('rect', { x: 1240, y: 300, width: 16, height: 160, rx: 4, fill: COL.dim }, p); put(door, { o: 0 }); show(door, m('out', .6));
    const ring = path(p, 'M700 330A120 40 0 1 1 699 330', { stroke: COL.bad, 'stroke-width': 4, 'stroke-dasharray': '12 10' }, { d: 0 });
    draw(ring, m('circle'), 2);
    hmSay(p, 'about 15 minutes of circles', 700, 620, m('circle', 1), { size: 26, fill: COL.bad, weight: 600 });
    tw(ch, { x: 960 }, m('back'), 1, io); hide(door, m('back', 1), .4);
    hmSay(p, 'slap! “You are talking in circles.”', 1080, 230, m('back', 4), { size: 24, fill: COL.real, weight: 700, anchor: 'start' });
    hide(ring, m('fast'), .4);
    hmSay(p, '✓ solved in short order', 700, 390, m('fast', .3), { size: 28, fill: COL.good, weight: 700 });
    hmSay(p, 'peer-plus-one', 1180, 560, m('name'), { size: 34, fill: COL.real, weight: 700 });
    hmRule(p, 'Peers often circle until someone senior steps in.', m('name', 6), 750);
  }],

  ['herd', 'Waiting for the herd', (m) => {
    const p = panel(0);
    hmHead(p, 'Afraid to stick their necks out');
    hmSay(p, 'An Intel engineer’s account, paraphrased', 800, 180, m('john'), { size: 22, fill: COL.dim });
    const xs = [360, 520, 680, 840, 1000, 1160];
    xs.forEach((x, i) => { const q = l11Person(p, x, 340, COL.whole, .85); show(q, m('feel', i * .1)); hmSay(p, '?', x, 280, m('feel', .8 + i * .1), { size: 28, fill: COL.dim }); });
    const st = G(p, { x: 760, y: 440, s: .6, o: 0 });
    T(st, '“I think our position seems to be…”', { x: 0, y: 0, size: 30, fill: COL.whole, anchor: 'middle', weight: 600 });
    show(st, m('weak')); tw(st, { s: 1.1 }, m('firm'), 2.5, io); tw(st.firstChild, { c_fill: COL.chalk }, m('firm', 1), 1);
    hmSay(p, 'offered weakly, as the group’s view, then restated more firmly', 800, 500, m('firm', 1.5), { size: 22, fill: COL.dim });
    hmBox(p, 520, 600, 420, 90, COL.faint, m('same'), 'car company', { size: 26, sub: ['wait for the boss'] });
    hmBox(p, 1080, 600, 420, 90, COL.faint, m('same', 1.5), 'peers', { size: 26, sub: ['wait for the group'] });
    hmRule(p, 'Either way, nobody speaks their mind.', m('same', 4), 750);
  }],

  ['confidence', 'The cure: confidence', (m) => {
    const p = panel(0);
    hmHead(p, 'The cure: self-confidence');
    hmSay(p, 'from knowing the issue, and from experience', 800, 190, m('fam'), { size: 26, fill: COL.dim });
    hmLines(p, ['Nobody ever died from a wrong business decision,', 'or from being overruled.'], 800, 280, m('gut'), { size: 36, fill: COL.good, weight: 700, lh: 48 });
    hmSay(p, 'Stalled, with no chairman?', 300, 470, m('lead'), { size: 26, anchor: 'start', weight: 600 });
    hmArrow(p, 300, 500, 300, 540, COL.dim, m('lead', 1), .3);
    hmSay(p, '1. the person with the most at stake takes charge', 300, 580, m('lead', 1.5), { size: 26, anchor: 'start' });
    hmSay(p, '2. or ask the most senior person present: a “godfather” of how decisions get made', 300, 630, m('senior'), { size: 26, anchor: 'start', fill: COL.real });
    hmRule(p, 'Confidence: no one dies from being overruled.', m('senior', 6), 750);
  }],

  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(MID, [{
    id: 'c-stall', prompt: ['Your cross-team working group has met three times and keeps circling. Nobody chairs it. What does Grove suggest?'],
    build: choice([['Keep meeting until a consensus emerges on its own'], ['The person with the most at stake takes charge; failing that, ask the senior person to'], ['Disband the group and decide yourself without them']], 1,
      'Peers stall without a peer-plus-one. Someone has to take charge of the process.',
      ['Grove’s role-play shows peers can circle indefinitely without noticing.', null, 'That throws away what the group knows. Shape the process instead.']),
  }], done) }],

  ['fears', 'Two fears', (m) => {
    const p = panel(0);
    hmHead(p, 'Two fears that withhold what the decision needs');
    hmBox(p, 440, 260, 560, 130, COL.bad, m('dumb'), 'Fear of sounding dumb', { size: 30, sub: ['seniors don’t ask; others whisper to a neighbour'] });
    hmBox(p, 1160, 260, 560, 130, COL.bad, m('over'), 'Fear of being overruled', { size: 30, sub: ['juniors hang back to avoid losing face'] });
    hmSay(p, 'Every withheld fact or question makes the decision worse.', 800, 390, m('each'), { size: 28, weight: 600 });
    l11Chip(p, 'experts: “we don’t know what the company wants”', 800, 470, COL.whole, m('unsure', 3), 640);
    l11Chip(p, 'managers: “we don’t know the technical detail”', 800, 535, COL.real, m('unsure', 6.5), 620);
    hmSay(p, 'Use intelligence and willpower: start the discussion, take a stand.', 800, 630, m('will'), { size: 28, fill: COL.good, weight: 700 });
    hmRule(p, 'Speak up anyway: withheld questions cost the decision.', m('will', 5), 750);
  }],

  ['q2', 'Quick check', () => { panel(0); }, { ask: done => quiz(MID, [{
    id: 'c-whisper', prompt: ['In a design review, a junior engineer whispers a concern about the test data to her neighbour. What should you do?'],
    build: choice([['Let it go: she can raise it later'], ['Invite her to say it to the room'], ['Ask her neighbour what she said']], 1,
      'A withheld fact makes the decision worse. Make it safe and normal to say it out loud.',
      ['Later may be after the decision is made.', null, 'That still keeps her voice out of the discussion.']),
  }], done) }],

  ['timing', 'When the senior person decides', (m) => {
    const p = panel(0);
    hmHead(p, 'When should the senior person decide?');
    // free discussion along a timeline: too early | the right window | too late
    path(p, 'M240 340H1360', { stroke: COL.dim, 'stroke-width': 4 });
    hmSay(p, 'free discussion →', 240, 310, .3, { size: 22, fill: COL.dim, anchor: 'start' });
    const z = (x0, x1, c, t) => { const r = mk('rect', { x: x0, y: 360, width: x1 - x0, height: 60, rx: 8, fill: c, opacity: .85 }, p); put(r, { o: 0 }); show(r, t); };
    z(240, 760, COL.bad, m('early'));
    hmLines(p, ['too early: position power', 'here is destructive'], 500, 460, m('early', .3), { size: 22, fill: COL.bad, weight: 600 });
    z(780, 1060, COL.good, m('legit'));
    hmLines(p, ['real issues aired,', 'no consensus: decide'], 920, 460, m('legit', .3), { size: 22, fill: COL.good, weight: 600 });
    z(1080, 1360, COL.bad, m('late'));
    hmLines(p, ['too late: people drift', 'from a near-consensus'], 1220, 460, m('late', .3), { size: 22, fill: COL.bad, weight: 600 });
    hmSay(p, 'Giving orders feels “not nice”, so discussion drags on.', 800, 590, m('nice'), { size: 26 });
    hmSay(p, 'Don’t decide while only the early, superficial points are out.', 800, 640, m('criteria'), { size: 24, fill: COL.dim });
    hmRule(p, 'Decide when the real issues are aired: not before, not long after.', m('late', 6), 750);
  }],

  ['six', 'The six questions', (m) => {
    const p = panel(0);
    hmHead(p, 'Six questions to settle in advance');
    L11_Q.forEach((s, i) => {
      const x = 330 + (i % 3) * 470, y = 280 + Math.floor(i / 3) * 190;
      hmBox(p, x, y, 420, 140, COL.whole, m('w' + (i + 1)), s, { size: 30 });
      const n = G(p, { x: x - 190, y: y - 50, o: 0 }); mk('circle', { r: 22, fill: COL.task }, n); T(n, String(i + 1), { x: 0, y: 9, size: 24, fill: COL.board, weight: 700, anchor: 'middle' }); show(n, m('w' + (i + 1)));
    });
    hmSay(p, 'A decision is an output: say what output you expect.', 800, 640, m('q'), { size: 26, fill: COL.dim });
    hmRule(p, 'Settle the six questions before you start.', m('w6', 2), 750);
  }],

  ['plant', 'Grove’s Philippine plant', (m) => {
    const p = panel(0);
    hmHead(p, 'Grove’s example: the Philippine plant');
    const rows = [
      ['What?', 'a multistory plant next door, or a low one on cheaper land farther away', m('what')],
      ['When?', 'needed in 2–2½ years; working back with offsets: decide within a month', m('when')],
      ['Who decides?', 'two construction and two plant managers, at matching levels', m('who')],
      ['Consulted?', 'each of them, their own staff, beforehand', m('who', 7)],
      ['Ratify or veto?', 'Grove: the first boss they shared', m('ratify')],
      ['Told?', 'Gordon Moore, chairman of the board', m('inform')],
    ];
    rows.forEach(([q, a, t], i) => {
      const y = 200 + i * 64;
      hmSay(p, q, 430, y, t, { size: 26, fill: COL.whole, weight: 700, anchor: 'end' });
      hmSay(p, a, 460, y, t + .3, { size: 26, anchor: 'start' });
    });
    hmSay(p, 'Result: build next door, capped at four stories.', 800, 620, m('result'), { size: 30, fill: COL.good, weight: 700 });
    hmSay(p, 'Grove probed the facts and the reasoning, then ratified.', 800, 670, m('result', 4), { size: 24, fill: COL.dim });
    hmRule(p, 'Answer the six questions, and the decision has a clear path.', m('result', 8), 750);
  }],

  ['q3', 'Quick check', () => { panel(0); }, { ask: done => quiz(MID, [{
    id: 'c-six', prompt: ['Which of the six questions does each line answer?'],
    build: grid([
      { parts: ['The vice president can approve or overturn the final choice.'], ans: ['r'], why: 'Ratify or veto.' },
      { parts: ['Finance hears the outcome once it is settled.'], ans: ['i'], why: 'Who is told.' },
      { parts: ['Two clinical leads and two engineering leads make the call.'], ans: ['d'], why: 'Who decides: balanced sides.' },
      { parts: ['Each lead gathers their team’s views first.'], ans: ['c'], why: 'Who is consulted.' },
    ], [['d', 'Decides', null, 'D'], ['c', 'Consulted', null, 'C'], ['r', 'Ratifies', null, 'R'], ['i', 'Told', null, 'T']], { multi: false, text: true }),
  }], done) }],

  ['veto', 'No surprise vetoes', (m) => {
    const p = panel(0);
    hmHead(p, 'Why settle the questions first');
    for (let i = 0; i < 6; i++) { const r = mk('rect', { x: 240 + i * 130, y: 230, width: 120, height: 50, rx: 6, fill: COL.whole }, p); put(r, { o: 0 }); show(r, .3 + i * .1); }
    hmSay(p, 'weeks of work on the decision', 620, 320, .5, { size: 22, fill: COL.dim });
    const lt = l11Person(p, 1180, 250, COL.real); show(lt, m('late'));
    const stamp = G(p, { x: 1340, y: 250, o: 0, r: -12 }); mk('rect', { x: -70, y: -30, width: 140, height: 60, rx: 6, fill: 'none', stroke: COL.bad, 'stroke-width': 4 }, stamp); T(stamp, 'VETO', { x: 0, y: 12, size: 32, fill: COL.bad, weight: 700, anchor: 'middle' });
    pop(stamp, m('late', 4));
    hmSay(p, 'demoralizing', 620, 380, m('demor'), { size: 26, fill: COL.bad, weight: 600 });
    hmSay(p, 'and it looks like politics', 1000, 380, m('pol'), { size: 26, fill: COL.bad, weight: 600 });
    hmSay(p, 'A shocking final word?', 800, 480, m('drama'), { size: 28, weight: 700 });
    hmChain(p, ['announce', 'adjourn', 'reconvene, listen'], [440, 800, 1160], 570, 280, 80, COL.good, [m('recon', -1), m('recon', .5), m('recon', 2)]);
    hmRule(p, 'No surprise vetoes. If the answer shocks, reconvene.', m('recon', 5), 750);
  }],

  ['sloan', 'Sloan and John Wayne', (m) => {
    const p = panel(0);
    hmHead(p, 'Hard, and worth it');
    hmLines(p, ['Alfred Sloan (General Motors): leaders are tempted to decide', 'themselves and skip the burdensome discussion. (paraphrased)'], 800, 200, m('sloan'), { size: 26, fill: COL.dim, lh: 36 });
    const box = (x, s, t) => { hmBox(p, x, 420, 300, 120, COL.faint, t, s, { size: 28 }); };
    box(400, 'Intel', .3); box(1200, 'decide-alone firm', m('wayne', 3));
    const jw = l11Person(p, 400, 320, COL.nat); show(jw, m('wayne'));
    hmSay(p, '“John Wayne”', 400, 375, m('wayne'), { size: 22, fill: COL.nat });
    tw(jw, { x: 1200 }, m('wayne', 4), 1.2, io);
    hmSay(p, 'four months later', 800, 520, m('back'), { size: 24, fill: COL.dim });
    tw(jw, { x: 400 }, m('back', .5), 1.2, io);
    hmSay(p, 'If he could decide without consulting anyone, so could everyone else.', 800, 630, m('why'), { size: 28, fill: COL.good, weight: 600 });
    hmRule(p, 'Group decisions are hard, and worth it.', m('why', 4), 750);
  }],

  ['q4', 'Quick check', () => { panel(0); }, { ask: done => quiz(MID, [{
    id: 'c-veto', prompt: ['Your skip-level manager hears about your team’s decision only after it is final, and overturns it. What should have happened?'],
    build: choice([['Nothing: senior people can always overrule'], ['Agree up front who ratifies or vetoes, and bring them in before the end'], ['Hide the decision until it was too late to reverse']], 1,
      'Settling the six questions in advance turns a surprise veto into a planned review.',
      ['They can, but a surprise veto demoralizes people and looks political.', null, 'That is exactly the politics Grove says to avoid.']),
  }], done) }],

  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    hmSay(p, 'Lesson 11 in five lines', 800, 120, .2, { size: 40, weight: 600 });
    hmWrap(p, [['Peers circle until a peer-plus-one steps in.', 'w1'], ['Fear of sounding dumb or being overruled costs facts.', 'w2'], ['The senior person decides only when discussion is done.', 'w3'], ['Settle the six questions before you start.', 'w4'], ['No surprise vetoes; if the answer shocks, reconvene.', 'w5']], m);
  }],

  ['final1', 'Lesson practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [
    { id: 'p-plus1', prompt: ['You are the senior person in a peer group that has circled for an hour. What is your role?'],
      build: choice([['Stay out of it: they are peers'], ['Step in to shape the process and push toward a decision'], ['Take over and decide on the spot']], 1,
        'As the peer-plus-one, you give the group the structure and confidence to decide.',
        ['Without someone to shape it, the group may never notice it is circling.', null, 'Deciding before the real issues are aired wastes the discussion.']) },
    { id: 'p-when', prompt: ['When is it legitimate for the senior person simply to decide?'],
      build: choice([['At the start, to save everyone time'], ['After free discussion, when no consensus has formed and the time has come'], ['Never: decisions must be unanimous']], 1,
        'Position power at the clear-decision stage is legitimate; any earlier, it is destructive.',
        ['That cuts off the discussion that makes the decision good.', null, 'Consensus often never comes; someone must decide.']) },
    { id: 'p-six', prompt: ['Before a pricing decision meeting, what should you settle?'],
      build: choice([['Only the agenda'], ['The six questions: what, when, who decides, who is consulted, who ratifies, who is told'], ['Who will present the slides']], 1,
        'The six questions make the path to the output clear for everyone.',
        ['An agenda without the six questions leaves roles and the veto unclear.', null, 'Presentation is logistics, not decision structure.']) },
    { id: 'p-shock', prompt: ['You ratify a decision that will surprise everyone involved. What next?'],
      build: choice([['Announce it and move on'], ['Announce it, adjourn, then reconvene to hear their views'], ['Delay announcing it until people forget the discussion']], 1,
        'People need time to absorb the unexpected. Reconvening helps them accept it.',
        ['Walking away leaves people to stew.', null, 'Delay only makes the surprise worse.']) },
    { id: 'p-wayne', prompt: ['A colleague wants a job where he can make every decision alone. What does Grove’s “John Wayne” story suggest?'],
      build: choice([['He will thrive'], ['If he can decide alone, so can everyone else, and their decisions will hit him'], ['Only junior people should consult']], 1,
        'The manager who tried it came back in four months.',
        ['Grove’s example went the other way.', null, 'Consulting is how know-how businesses make good decisions at every level.']) },
  ], done, 'Lesson practice') }],

  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
boot();
</script>
</body>
</html>
