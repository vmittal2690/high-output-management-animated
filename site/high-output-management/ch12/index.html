/* Colours: purple = step 1, demand; blue = step 2, present status and ordinary work; green = step 3, the actions
   that close the gap (the strategy); red = the gap or a problem; amber = the rule. */
const L12_C = [COL.real, COL.whole, COL.good];
function l12Person(p, x, y, color, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('circle', { cy: -22, r: 16, fill: color }, g);
  path(g, 'M-28 26C-28 0 -14 -4 0 -4C14 -4 28 0 28 26Z', { fill: color, stroke: 'none' });
  return g;
}
const l12Chip = (p, s, x, y, color, t0, w, size = 24) => {
  const g = G(p, { o: 0 }); mk('rect', { x: x - w / 2, y: y - 24, width: w, height: 48, rx: 24, fill: '#16211d', stroke: color, 'stroke-width': 2.5 }, g);
  T(g, s, { x, y: y + 8, size, fill: color, anchor: 'middle' }); show(g, t0); return g;
};
// A numbered step disc in its step colour.
function l12Step(p, n, x, y, t0, r = 24) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r, fill: L12_C[n - 1] }, g);
  T(g, String(n), { x: 0, y: r * .42, size: r * 1.15, fill: COL.board, weight: 700, anchor: 'middle' });
  show(g, t0); return g;
}
// A bar that grows to the right from x.
function l12BarR(p, x, y, w, h, fill, t0, dur = .8) {
  const r = mk('rect', { x, y, width: 0, height: h, rx: 6, fill }, p);
  put(r, { a_width: 0 }); tw(r, { a_width: w }, t0, dur, out); return r;
}
function l12Doc(p, x, y, color, frac, t0) {
  const g = G(p, { x, y, o: 0 });
  mk('rect', { x: -22, y: -28, width: 44, height: 56, rx: 5, fill: '#16211d', stroke: color, 'stroke-width': 3 }, g);
  mk('rect', { x: -22, y: 28 - 56 * frac, width: 44, height: 56 * frac, rx: 5, fill: color, opacity: .55 }, g);
  show(g, t0); return g;
}

      { parts: ['Discount the pipeline for projects likely to be cancelled'], ans: ['s'], why: 'Step 2: not every started project finishes.' },
      { parts: ['Hand a non-critical task to a less busy group'], ans: ['c'], why: 'Step 3: an action that narrows the gap.' },
      { parts: ['Compare what hospitals expect now with what they will expect in a year'], ans: ['d'], why: 'Step 1: the difference between demand now and later.' },
      { parts: ['Request headcount, with the plan as the case'], ans: ['c'], why: 'Step 3: part of the strategy to close the gap.' },
    ], [['d', '1 Demand', COL.real, 'D'], ['s', '2 Status', COL.whole, 'S'], ['c', '3 Close the gap', COL.good, 'C']], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    hmSay(p, 'Lesson 12 in five lines', 800, 120, .2, { size: 40, weight: 600 });
    hmWrap(p, [['Plan in three steps: demand, status, close the gap.', 'w1'], ['Look now and a year out; plan for the difference.', 'w2'], ['State demand honestly, before thinking of capacity.', 'w3'], ['Count the pipeline in demand’s terms, minus losses.', 'w4'], ['Your actions to close the gap are your strategy.', 'w5']], m);
  }],

  ['final1', 'Lesson practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [
    { id: 'p-demand', prompt: ['Planning next year, a peer lists only the requests her team thinks it can handle. What would Grove say?'],
      build: choice([['Sensible: it avoids overpromising'], ['List the real demand first; deal with capacity in step 3'], ['Skip demand and start from current projects']], 1,
        'Shrinking demand to fit capacity means nobody ever builds up to the real need.',
        ['It hides the real demand, so the gap is never seen or closed.', null, 'Without demand there is nothing to compare your status against.']) },
    { id: 'p-currency', prompt: ['Demand is stated as verified device-software releases (illustrative). How should you count work in progress?'],
      build: choice([['As hours spent so far'], ['As partly finished releases, with when each will come out'], ['As the number of people on the team']], 1,
        'Use the same currency as demand, and note the timing of each item in the pipeline.',
        ['Hours spent can’t be compared with releases demanded.', null, 'Headcount is a capability, not output in the pipeline.']) },
    { id: 'p-loss', prompt: ['Your pipeline holds 10 clinical evidence packages (illustrative). How many should the plan count on?'],
      build: choice([['All 10: they are all started'], ['Fewer: allow for some to be dropped or delayed'], ['None until each is finished']], 1,
        'Not every started project finishes. Factor in some loss, as chip-makers do.',
        ['Some will be scrapped or delayed; planning on all 10 overstates your output.', null, 'That ignores real work in progress and overstates the gap.']) },
    { id: 'p-tactic', prompt: ['Your director’s strategy is to move all device test data to one system. Your plan to migrate your lab’s records is…'],
      build: choice([['Your strategy, and her tactics'], ['Only tactics: strategy is for directors'], ['Unrelated to her strategy']], 0,
        'One level’s strategy is the tactical concern of the level above.',
        [null, 'Every manager has a strategy: the general summary of their own plan.', 'It implements hers, so it is her tactics.']) },
    { id: 'p-narrow', prompt: ['Your team can’t finish everything required this year, and you can’t hire. What did Grove’s marketing manager do?'],
      build: choice([['Dropped the plan as hopeless'], ['Narrowed the gap: shifted non-critical work, added temporary help, used the plan to ask to grow'], ['Had everyone work weekends until it was done']], 1,
        'He accepted that a full match was impossible, narrowed the gap, and let the plan make his case.',
        ['The plan is what shows the gap and justifies more people.', null, 'That is not a plan; it burns the team out and still may not close the gap.']) },
  ], done, 'Lesson practice') }],

  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
boot();
</script>
