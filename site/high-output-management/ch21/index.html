/* Colours: blue = training and capability (ordinary work); purple = motivation and the two upper needs,
   which make people perform; salmon = the three lower needs, which get people to show up;
   green = the goal (performance); red = a problem; amber = the rule. */
function l21Person(p, x, y, color, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('circle', { cy: -22, r: 16, fill: color }, g);
  path(g, 'M-28 26C-28 0 -14 -4 0 -4C14 -4 28 0 28 26Z', { fill: color, stroke: 'none' });
  return g;
}
const l21Chip = (p, s, x, y, color, t0, w, size = 24) => {
  const g = G(p, { o: 0 }); mk('rect', { x: x - w / 2, y: y - 24, width: w, height: 48, rx: 24, fill: '#16211d', stroke: color, 'stroke-width': 2.5 }, g);
  T(g, s, { x, y: y + 8, size, fill: color, anchor: 'middle' }); show(g, t0); return g;
};
// Maslow's ladder, bottom level 0 to top level 4. Drawn around (0, 0) = top centre; 76 px per level.
const L21_NEEDS = ['Physiological', 'Safety / security', 'Social / belonging', 'Esteem / recognition', 'Self-actualization'];
const L21_H = 76, l21W = i => 700 - i * 100;
const l21Col = i => i < 3 ? COL.nat : COL.real;
// opts: hi = levels shown in their colour (others dim); t0s = reveal time per level (or one time); labels = false hides text.
function l21Ladder(p, x, y, s, t0, { hi = [0, 1, 2, 3, 4], size = 24, labels = true } = {}) {
  const g = G(p, { x, y, s });
  return L21_NEEDS.map((n, i) => {
    const w = l21W(i), yy = (4 - i) * L21_H, on = hi.includes(i), c = on ? l21Col(i) : COL.faint;
    const lv = G(g, { o: 0 });
    const r = mk('rect', { x: -w / 2, y: yy + 3, width: w, height: L21_H - 6, rx: 8, fill: on ? '#1f2d29' : '#16211d', stroke: c, 'stroke-width': 3 }, lv);
    if (labels) T(lv, n, { x: 0, y: yy + L21_H / 2 + size * .35, size, fill: on ? c : COL.dim, anchor: 'middle', weight: 600 });
    show(lv, Array.isArray(t0) ? t0[i] : t0);
    return { g: lv, r };
  });
}

].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
boot();
</script>
