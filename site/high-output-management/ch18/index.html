/* Colours (as in lesson 17): purple = the mission-oriented side (division, general manager, a task force);
   salmon = functional supervision, peer councils and the coordinating plane; blue = ordinary people and the
   operating plane; chalk outline = the one person we follow; green = the goal; red = a problem; amber = the rule. */
function l18Person(p, x, y, color, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('circle', { cy: -22, r: 16, fill: color }, g);
  path(g, 'M-28 26C-28 0 -14 -4 0 -4C14 -4 28 0 28 26Z', { fill: color, stroke: 'none' });
  return g;
}
const l18Chip = (p, s, x, y, color, t0, w, size = 22) => {
  const g = G(p, { o: 0 }); mk('rect', { x: x - w / 2, y: y - 24, width: w, height: 48, rx: 24, fill: '#16211d', stroke: color, 'stroke-width': 2.5 }, g);
  T(g, s, { x, y: y + 8, size, fill: color, anchor: 'middle' }); show(g, t0); return g;
};
function l18Line(p, d, color, t0, dashed = false, dur = .5) {
  if (dashed) { const e = path(p, d, { stroke: color, 'stroke-width': 3, 'stroke-dasharray': '10 8' }, { o: 0 }); show(e, t0); return e; }
  const e = path(p, d, { stroke: color, 'stroke-width': 3 }, { d: 0 }); draw(e, t0, dur); return e;
}
// A small factory outline; returns its fill, which is shown when the plant is reached.
function l18Plant(p, x, y, t0) {
  const g = G(p, { x, y, o: 0 });
  const d = 'M-60 40V-10L-30 -30V-10L0 -30V-10L30 -30V-40H50V40Z';
  const fillE = path(g, d, { fill: COL.nat, stroke: 'none' }, { o: 0 });
  path(g, d, { fill: 'none', stroke: COL.dim, 'stroke-width': 3 });
  show(g, t0); return fillE;
}
// One plane of the two-plane chart: a slanted sheet with a small hierarchy on it.
function l18Plane(p, y0, color, fillA, t0, top, mid, her) {
  const sh = path(p, `M440 ${y0}H1400L1360 ${y0 + 240}H400Z`, { fill: fillA, stroke: color, 'stroke-width': 2 }, { o: 0 }); show(sh, t0);

  l18Line(p, `M860 ${y0 + 65}V${y0 + 81}H600V${y0 + 97}M860 ${y0 + 81}V${y0 + 97}M860 ${y0 + 81}H1120V${y0 + 97}`, color, t0 + .5, false, .5);
  hmBox(p, 1020, y0 + 200, 150, 46, COL.faint, t0 + 1, 'engineer', { size: 20, fill: COL.dim });
  const b = hmBox(p, 1215, y0 + 200, 220, 46, COL.chalk, her, 'process engineer', { size: 20 });

  return b;
}

        'Slash busywork and test each requirement with common sense, but the hybrid stays.',
        ['Playing with reporting lines doesn’t escape complexity.', null, 'That adds the bureaucracy Grove says to slash.']) },
    { id: 'p-chair', prompt: ['Your senior test engineer chairs a cross-site group on test-method standards. Your own boss joins it. Who leads the group’s meetings?'],
      build: choice([['Your boss: the most senior person present'], ['You, as the engineer’s manager'], ['Your test engineer, the chair']], 2,
        'In that plane the engineer is the chair; rank elsewhere doesn’t carry over.',
        ['Like Grove in his planning group, a senior person can be a member.', 'You aren’t on that plane at all unless you join it.', null]) },
    { id: 'p-temp', prompt: ['New regulatory guidance on AI-enabled device software affects four of your teams. What is the quickest good response? (illustrative)'],
      build: choice([['Reorganize the four teams under one manager'], ['Form a temporary task force from the four teams, and end it when done'], ['Let each team respond on its own']], 1,
        'Short-lived teams handle fast-changing problems; formal structure can’t move that fast.',
        ['Formal reorganization can’t keep up with fast change.', null, 'The problem crosses teams; separate answers fragment the response.']) },
  ], done, 'Lesson practice') }],

  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
