<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growing maturity, and the traps</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/book.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 24, title: 'Growing maturity, and the traps', kicker: 'Chapter 12 · Lesson 2', minutes: 12, language: 'en', silent: true, next: '../ch25/index.html' };

/* Colours (as in lesson 23): salmon = structured style (low TRM); pink = individual, communicating style
   (medium TRM); purple = minimal involvement and monitoring (high TRM); blue = ordinary work and social ties;
   grey = structure imposed from outside; green = the goal or a good result; red = a problem; amber = the rule. */
function l24Person(p, x, y, color, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('circle', { cy: -22, r: 16, fill: color }, g);
  path(g, 'M-28 26C-28 0 -14 -4 0 -4C14 -4 28 0 28 26Z', { fill: color, stroke: 'none' });
  return g;
}
const l24Chip = (p, s, x, y, color, t0, w, size = 24) => {
  const g = G(p, { o: 0 }); mk('rect', { x: x - w / 2, y: y - 24, width: w, height: 48, rx: 24, fill: '#16211d', stroke: color, 'stroke-width': 2.5 }, g);
  T(g, s, { x, y: y + 8, size, fill: color, anchor: 'middle' }); show(g, t0); return g;
};
// A speech bubble whose left edge is at x.
function l24Bubble(p, s, x, y, color, t0) {
  const w = s.length * 12.6 + 48, g = G(p, { o: 0 });
  mk('rect', { x, y: y - 26, width: w, height: 52, rx: 18, fill: '#16211d', stroke: color, 'stroke-width': 2.5 }, g);
  T(g, s, { x: x + 22, y: y + 8, size: 24, fill: color });
  show(g, t0); return g;
}
const L24_X = [330, 800, 1270];
const L24_STY = [['Structured', ['tell what, when, how'], COL.nat], ['Individual-oriented', ['talk it through, support'], COL.rat], ['Minimal involvement', ['agree objectives, monitor'], COL.real]];
// The three styles of Grove's table (p. 175) as a row of boxes.
const l24Styles = (p, y, t0, h = 120, sub = true) => L24_STY.map(([n, s, c], i) => hmBox(p, L24_X[i], y, 400, h, c, t0 + i * .1, n, { size: 28, fill: c, sub: sub ? s : undefined }));

const BEATS = [
  ['intro', 'Growing maturity, and the traps', (m, D) => hmTitle(m, D, 'Chapter 12 · Task-Relevant Maturity · Lesson 2 of 2', 'Growing maturity, and the traps', 'How TRM grows, why to speed it up, and what gets in the way')],

  ['inside', 'Structure moves inside', (m) => {
    const p = panel(0);
    hmHead(p, 'Structure moves inside');
    hmSay(p, 'total structure: about the same at every stage (schematic)', 800, 200, m('same'), { size: 24, fill: COL.dim });
    const base = 560, split = [[250, 50], [150, 150], [50, 250]], names = [['structured', COL.nat], ['communicating', COL.rat], ['monitoring', COL.real]];
    [400, 800, 1200].forEach((cx, i) => {
      const t = m('same', 2 + i * 1.2), [im, ins] = split[i];
      hmBarUp(p, cx - 80, base, 160, ins, COL.good, t);
      hmBarUp(p, cx - 80, base - ins, 160, im, COL.faint, t + .4);
      hmSay(p, names[i][0], cx, 600, t, { size: 24, fill: names[i][1], weight: 600 });
    });
    hmSay(p, 'imposed by you', 1300, 292, m('moves'), { size: 22, fill: COL.dim, anchor: 'start' });
    hmSay(p, 'held inside', 1300, 450, m('moves'), { size: 22, fill: COL.good, anchor: 'start', weight: 600 });
    hmSay(p, 'A teenager knows not to cross the interstate on his bike.', 800, 670, m('teen'), { size: 26 });
    hmRule(p, 'Structure doesn’t vanish as TRM grows. It moves inside.', m('moves', 2), 745);
  }],

  ['values', 'Shared operational values', (m) => {
    const p = panel(0);
    hmHead(p, 'Pass on the operational values');
    show(l24Person(p, 260, 310, COL.chalk), .3); show(l24Person(p, 1340, 310, COL.chalk), .4);
    hmSay(p, 'you', 260, 380, .3, { size: 22, fill: COL.dim }); hmSay(p, 'report', 1340, 380, .4, { size: 22, fill: COL.dim });
    hmArrow(p, 330, 300, 1270, 300, COL.whole, m('ops'), .8);
    hmSay(p, 'the right way of doing things, early', 800, 280, m('ops', .3), { size: 24, fill: COL.whole });
    [['values', 600, 160], ['priorities', 800, 190], ['preferences', 1000, 200]].forEach(([s, x, w], i) => l24Chip(p, s, x, 370, COL.whole, m('common', i * .5), w));
    hmSay(p, 'later, they decide much as you would', 800, 460, m('ops', 2.5), { size: 28, fill: COL.good, weight: 600 });
    hmSay(p, 'without them: confusion, and no sense of purpose', 800, 540, m('confuse'), { size: 26, fill: COL.bad, weight: 600 });
    hmSay(p, 'you answer for their output, and you can’t delegate without shared values', 800, 620, m('yours', 2), { size: 24, fill: COL.dim });
    hmRule(p, 'Passing on shared values is the supervisor’s job.', m('yours'), 745);
  }],

  ['tuition', 'Who pays the tuition?', (m) => {
    const p = panel(0);
    hmHead(p, 'Who pays the tuition?');
    l24Bubble(p, '“He has to make his own mistakes.”', 560, 200, COL.chalk, m('own'));
    hmSay(p, 'an outstanding associate, about his junior hire', 800, 260, m('own', .5), { size: 20, fill: COL.dim });
    show(l24Person(p, 260, 400, COL.whole), m('hire'));
    hmSay(p, 'junior hire', 260, 470, m('hire'), { size: 22, fill: COL.whole });
    hmArrow(p, 320, 390, 470, 390, COL.dim, m('hire', 1.5), .4);
    [540, 630, 720].forEach((x, i) => pop(hmCross(p, x, 390, COL.bad, 18), m('hire', 2 + i * .3)));
    hmSay(p, 'poor work', 630, 470, m('hire', 2.5), { size: 22, fill: COL.bad });
    hmArrow(p, 780, 390, 960, 390, COL.dim, m('cust'), .4);
    [1060, 1160, 1260].forEach((x, i) => show(l24Person(p, x, 400, COL.bad), m('cust', .4 + i * .2)));
    hmSay(p, 'customers pay the tuition', 1160, 470, m('cust', .8), { size: 24, fill: COL.bad, weight: 600 });
    hmSay(p, 'inside the company or outside', 1160, 505, m('int'), { size: 22, fill: COL.dim });
    hmBox(p, 800, 620, 560, 80, COL.good, m('teach'), 'The supervisor does the teaching', { size: 28, fill: COL.good });
    hmRule(p, 'Customers should not pay for your report’s lessons.', m('teach', 2.5), 745);
  }],

  ['q1', 'Quick check', () => { panel(0); }, { ask: done => quiz(MID, [{
    id: 'c-tuition', prompt: ['A new complaint-handling specialist keeps misclassifying device complaints. A peer says: “Let her learn from her mistakes.” What would Grove say? (Illustrative.)'],
    build: choice([['Agree: mistakes are the best teacher'], ['Teach her now, or the customers, and patients, pay the tuition'], ['Move her off the task']], 1,
      'Teaching is the supervisor’s job. Her mistakes land on the people the work serves.',
      ['Here the customers pay for her lessons, and in this work, patients too.', null, 'Her TRM is low because the task is new. Raise it by teaching.']),
  }], done) }],

  ['lev', 'Why raise TRM fast', (m) => {
    const p = panel(0);
    hmHead(p, 'Raise TRM as fast as you can');
    hmSay(p, 'your time per report (illustrative)', 480, 200, m('time'), { size: 22, fill: COL.dim });
    [['structured', 460, COL.nat], ['communicating', 280, COL.rat], ['minimal', 90, COL.real]].forEach(([s, w, c], i) => {
      const y = 240 + i * 75;
      hmSay(p, s, 240, y + 27, m('time', .3 + i * .5), { size: 22, fill: c, anchor: 'end', weight: 600 });
      const r = mk('rect', { x: 260, y, width: 0, height: 38, rx: 6, fill: c }, p); put(r, { a_width: 0 }); tw(r, { a_width: w }, m('time', .3 + i * .5), .6, out);
    });
    hmSay(p, '1', 480, 500, m('time', 2), { size: 30, fill: COL.good, weight: 700 });
    hmSay(p, 'less of your time', 480, 540, m('time', 2), { size: 26, fill: COL.good, weight: 600 });
    hmBox(p, 1150, 270, 600, 120, COL.good, m('dele'), '2  Delegate: more leverage', { size: 28, fill: COL.good, sub: ['once values are shared and TRM is high'] });
    hmBox(p, 1150, 450, 600, 120, COL.good, m('self'), '3  Motivation from within', { size: 28, fill: COL.good, sub: ['self-actualization: the strongest source'] });
    hmSay(p, 'at the top, training is complete', 1150, 560, m('self', 1), { size: 22, fill: COL.dim });
    hmRule(p, 'Raise TRM fast: it frees your time and adds leverage.', m('self', 5), 745);
  }],

  ['sergeant', 'The sergeant', (m) => {
    const p = panel(0);
    hmHead(p, 'The sergeant: style follows the situation');
    l24Styles(p, 220, .3, 80, false);
    const dot = G(p, { x: 1270, y: 300, o: 0 });
    path(dot, 'M-14 0L0 -22L14 0Z', { fill: COL.chalk, stroke: 'none' });
    mk('circle', { cy: 12, r: 14, fill: COL.chalk }, dot);
    show(dot, m('camp'));
    hmSay(p, 'quiet camp: he just monitors', 1270, 370, m('camp', 1), { size: 24, fill: COL.real });
    draw(path(p, 'M900 650Q1150 530 1450 650', { stroke: COL.faint, 'stroke-width': 4 }, { d: 0 }), m('jeep', -.3), .6);
    const jeep = G(p, { x: 1500, y: 560, o: 0 });
    mk('rect', { x: -40, y: -18, width: 80, height: 32, rx: 6, fill: COL.bad }, jeep);
    mk('circle', { cx: -22, cy: 18, r: 9, fill: COL.bad }, jeep); mk('circle', { cx: 22, cy: 18, r: 9, fill: COL.bad }, jeep);
    tw(jeep, { o: 1, x: 1180 }, m('jeep'), 1.2, out);
    tw(dot, { x: 330 }, m('bark'), .5, out);
    hmSay(p, 'enemy over the hill: what, when, how', 330, 370, m('bark', .3), { size: 24, fill: COL.nat, weight: 600 });
    tw(dot, { x: 800 }, m('months', 2.5), 1.5);
    hmSay(p, 'months of the same fight: routine again', 800, 450, m('months'), { size: 24, fill: COL.rat });
    tw(dot, { x: 1120 }, m('ease'), 2);
    hmSay(p, 'TRM for fighting rises: he eases off', 1120, 510, m('ease', .5), { size: 24, fill: COL.real });
    hmRule(p, 'When things suddenly change, go back to what, when and how.', m('ease', 3), 745);
  }],

  ['time', 'Effective, for now', (m) => {
    const p = panel(0);
    hmHead(p, 'Work your way up, and drop back fast');
    const base = 520;
    [['structured', 110, COL.nat], ['communicating', 220, COL.rat], ['monitoring', 330, COL.real]].forEach(([s, h, c], i) => {
      hmBarUp(p, 220 + i * 250, base, 200, h, c, m('paper', i * .7));
      hmSay(p, s, 320 + i * 250, 560, m('paper', i * .7), { size: 24, fill: c, weight: 600 });
    });
    hmSay(p, 'working up takes time (schematic)', 570, 610, m('paper', 2), { size: 22, fill: COL.dim });
    draw(path(p, 'M940 180C700 100 330 200 320 390', { stroke: COL.bad, 'stroke-width': 4 }, { d: 0 }), m('revert'), .8);
    draw(path(p, 'M306 370L320 394L334 370', { stroke: COL.bad, 'stroke-width': 4 }, { d: 0 }), m('revert', .7), .2);
    hmSay(p, 'sudden change', 600, 232, m('revert', .5), { size: 24, fill: COL.bad, weight: 600 });
    hmLines(p, ['The prejudice: what-when-how', 'seems unenlightened, so we', 'take it up too late.'], 1010, 250, m('prej'), { size: 24, fill: COL.bad, anchor: 'start', lh: 34 });
    hmLines(p, ['Not good or bad:', 'effective or not, here, now.'], 1010, 430, m('eff'), { size: 26, fill: COL.good, anchor: 'start', weight: 600, lh: 36 });
    hmSay(p, 'It changes day by day, sometimes hour by hour.', 800, 670, m('hour', 2), { size: 28, weight: 600 });
    hmRule(p, 'No mode is good or bad, only effective or not, for now.', m('hour', 5), 745);
  }],

  ['q2', 'Quick check', () => { panel(0); }, { ask: done => quiz(MID, [{
    id: 'c-now', prompt: ['Which style fits right now? (Illustrative cases.)'],
    build: grid([
      { parts: ['A field safety notice lands; the team has never run one'], ans: ['s'], why: 'A sudden new task: TRM is low, so what, when and how.' },
      { parts: ['A capable engineer, a year in the role, weighing two test strategies'], ans: ['c'], why: 'Medium TRM: reason it through together, with support.' },
      { parts: ['Your veteran lead runs her tenth routine software release'], ans: ['m'], why: 'High TRM: agree the objectives and monitor.' },
      { parts: ['A new hire’s first week on the complaint-handling system'], ans: ['s'], why: 'New to the task: tell what, when and how.' },
    ], [['s', 'Structured', COL.nat, 'S'], ['c', 'Communicating', COL.rat, 'C'], ['m', 'Monitoring', COL.real, 'M']], { multi: false, text: true }),
  }], done) }],

  ['extremes', 'The skipped middle', (m) => {
    const p = panel(0);
    hmHead(p, 'It’s not easy: the skipped middle');
    hmSay(p, 'TRM is hard to judge, and your preferences override it', 800, 175, m('hard'), { size: 24, fill: COL.dim });
    hmSay(p, 'their TRM: medium', 800, 238, m('med'), { size: 26, fill: COL.rat, weight: 600 });
    l24Styles(p, 330, m('med', .3), 120);
    draw(path(p, 'M760 395C700 500 400 500 340 400', { stroke: COL.bad, 'stroke-width': 4 }, { d: 0 }), m('imm'), .7);
    draw(path(p, 'M326 418L338 396L352 416', { stroke: COL.bad, 'stroke-width': 4 }, { d: 0 }), m('imm', .6), .2);
    hmSay(p, 'immersed: making their decisions', 330, 540, m('imm', .5), { size: 24, fill: COL.bad, weight: 600 });
    draw(path(p, 'M840 395C900 500 1200 500 1260 400', { stroke: COL.bad, 'stroke-width': 4 }, { d: 0 }), m('alone'), .7);
    draw(path(p, 'M1248 416L1262 396L1274 418', { stroke: COL.bad, 'stroke-width': 4 }, { d: 0 }), m('alone', .6), .2);
    hmSay(p, 'left alone: not to be bothered', 1270, 540, m('alone', .5), { size: 24, fill: COL.bad, weight: 600 });
    hmSay(p, 'The middle style, the one that fits, gets skipped.', 800, 640, m('mid'), { size: 28, weight: 600 });
    hmRule(p, 'Medium TRM needs the middle style. Don’t skip it.', m('mid', 2.5), 745);
  }],

  ['mirror', 'How we see ourselves', (m) => {
    const p = panel(0);
    hmHead(p, 'You delegate less than you think');
    hmSay(p, 'supervisors rated their own style; their reports rated it too', 800, 190, m('test'), { size: 24, fill: COL.dim });
    for (let i = 0; i < 10; i++) show(l24Person(p, 350 + i * 100, 300, i < 9 ? COL.bad : COL.dim, .9), m('ninety', .3 + i * .15));
    hmSay(p, 'about 9 in 10 saw themselves as more communicating or delegating', 800, 390, m('ninety', 2), { size: 26, fill: COL.bad, weight: 600 });
    hmSay(p, 'Grove’s survey, 1983', 800, 425, m('ninety', 2), { size: 18, fill: COL.faint });
    hmSay(p, 'we think of ourselves as perfect delegators', 800, 500, m('why'), { size: 24, fill: COL.dim });
    l24Bubble(p, 'Maybe try a new fixture?', 230, 600, COL.chalk, m('sugg'));
    hmSay(p, 'your suggestion', 400, 650, m('sugg'), { size: 20, fill: COL.dim });
    hmArrow(p, 620, 600, 900, 600, COL.dim, m('heard'), .5);
    l24Bubble(p, 'heard as: “Do it.”', 920, 600, COL.bad, m('heard', .4));
    hmSay(p, 'marching orders', 1060, 650, m('heard', .4), { size: 20, fill: COL.bad });
    hmRule(p, 'You are likely less of a delegator than you think.', m('heard', 2.5), 745);
  }],

  ['q3', 'Quick check', () => { panel(0); }, { ask: done => quiz(MID, [{
    id: 'c-orders', prompt: ['In passing, you say the test team “might try” a different fixture. A week later they have rebuilt the bench around it. What happened? (Illustrative.)'],
    build: choice([['They showed initiative'], ['Your suggestion was heard as marching orders'], ['Their TRM for the task is high']], 1,
      'A manager’s passing suggestion often lands as an order. Say which kind it is.',
      ['They acted on your words, not on their own judgment.', null, 'This is about how your words land, not about their maturity.']),
  }], done) }],

  ['social', 'Social is not communicating', (m) => {
    const p = panel(0);
    hmHead(p, 'A friendship is not a style');
    hmBox(p, 420, 300, 520, 170, COL.whole, .3, 'Social relationship', { size: 30, fill: COL.whole, sub: ['skiing and drinks', 'together'] });
    hmBox(p, 1180, 300, 520, 170, COL.rat, m('care'), 'Communicating style', { size: 30, fill: COL.rat, sub: ['a caring involvement', 'in their work'] });
    hmSay(p, '≠', 800, 330, m('wrong'), { size: 80, fill: COL.bad, weight: 700 });
    hmSay(p, 'one may help build the other, but don’t confuse them', 800, 450, m('help'), { size: 26 });
    hmSay(p, 'a week of fishing each year, work off limits', 540, 580, m('fish'), { size: 24, fill: COL.whole, anchor: 'middle' });
    hmArrow(p, 840, 572, 990, 572, COL.dim, m('dist'), .4);
    hmSay(p, 'at work: still distant', 1200, 580, m('dist', .3), { size: 26, fill: COL.bad, weight: 600 });
    hmRule(p, 'A friendship is not a communicating style.', m('dist', 2), 745);
  }],

  ['friends', 'Friends at work?', (m) => {
    const p = panel(0);
    hmHead(p, 'Friends at work?');
    hmBox(p, 480, 250, 600, 120, COL.good, m('plus'), 'Plus', { size: 30, fill: COL.good, sub: ['a communicating style comes easily'] });
    hmBox(p, 1120, 250, 600, 120, COL.bad, m('minus'), 'Minus', { size: 30, fill: COL.bad, sub: ['harder to go back to what, when, how'] });
    hmSay(p, 'making a friend toe a disciplinary line, in two cases Grove saw:', 800, 380, m('cases'), { size: 22, fill: COL.dim });
    l24Chip(p, 'friendship destroyed', 520, 440, COL.bad, m('cases', 4), 330);
    l24Chip(p, 'it worked: he felt looked after', 1080, 440, COL.good, m('ok', 1), 450);
    hmBox(p, 800, 590, 1000, 120, COL.chalk, m('test'), 'The test: picture giving them a tough review.', { size: 30, sub: ['you cringe: don’t make friends at work.  you don’t: friendship may help.'] });
    hmRule(p, 'Could you give this friend a tough review? That is the test.', m('test', 6), 745);
  }],

  ['q4', 'Quick check', () => { panel(0); }, { ask: done => quiz(MID, [{
    id: 'c-friend', prompt: ['You and a report have become close friends. Picturing her tough review next month, you dread it. What does Grove’s test suggest?'],
    build: choice([['Friendship at work is fine for everyone'], ['Friendship at work may not suit you: keep this one professional'], ['Leave the hard parts out of the review']], 1,
      'Grove leaves it to each person. Your dread is the signal.',
      ['Grove says each person must decide, and the cringe test decides it for you.', null, 'The review is the job. Softening it shortchanges her.']),
  }], done) }],

  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    hmSay(p, 'Lesson 24 in five lines', 800, 120, .2, { size: 40, weight: 600 });
    hmWrap(p, [['As TRM grows, structure moves inside.', 'w1'], ['Teach shared values; customers don’t pay tuition.', 'w2'], ['Raise TRM fast; go back to orders when it changes.', 'w3'], ['Don’t skip the middle style; check how you’re seen.', 'w4'], ['Friendship isn’t a style: try the tough-review test.', 'w5']], m);
  }],

  ['final1', 'Lesson practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [
    { id: 'p-tuition', prompt: ['Your new data analyst’s errors keep reaching the clinical team that uses her reports. Who should pay for her learning?'],
      build: choice([['The clinical team: it is part of working together'], ['You, by teaching her now'], ['Nobody: the errors will stop on their own']], 1,
        'Teaching her is the supervisor’s job, not a cost for internal customers.',
        ['Internal customers should not pay her tuition either.', null, 'Without teaching, her TRM rises slowly, at others’ expense.']) },
    { id: 'p-crisis', prompt: ['A calm, experienced team faces a sudden defect in device software already in the field. Hours matter. Your style?'],
      build: choice([['Agree the objectives and check in next week'], ['Structured: say who does what, when and how'], ['Hold a long discussion to reach consensus']], 1,
        'Like the sergeant: a sudden new situation calls for what, when and how.',
        ['The situation changed, and their TRM for this new task is low.', null, 'A communicating style needs time the situation does not allow.']) },
    { id: 'p-medium', prompt: ['A report with medium TRM is drafting her first verification test plan. You are tempted to write it yourself. Grove?'],
      build: choice([['Write it: it will be faster'], ['Work through it with her: two-way, with support'], ['Leave her alone with it']], 1,
        'Medium TRM needs the middle style that managers tend to skip.',
        ['That is the immersed extreme: making her decisions for her.', null, 'That is the other extreme. Medium TRM needs more involvement.']) },
    { id: 'p-self', prompt: ['You believe you delegate well. How could you check?'],
      build: choice([['Trust your own view'], ['Ask your reports how they see your style'], ['Count how few meetings you hold']], 1,
        'Your reports’ view is the honest test; managers overrate themselves.',
        ['In Grove’s survey, about nine in ten supervisors saw themselves as more delegating than their reports did.', null, 'Fewer meetings could mean abdication, not delegation.']) },
    { id: 'p-golf', prompt: ['A peer says he has a communicating style with his reports because they play golf together. What would Grove say?'],
      build: choice([['He is right: closeness off the job is the same thing'], ['A social tie is not a caring involvement in their work'], ['Golf is fine, but drinks are not']], 1,
        'A communicating style is about involvement in the work, not time off the job.',
        ['Grove’s fishing pair stayed distant at work.', null, 'The activity is not the point; involvement in the work is.']) },
  ], done, 'Lesson practice') }],

  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
boot();
</script>
</body>
</html>
