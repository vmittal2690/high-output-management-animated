/* Colours: green = the objective (the goal) and actions planning produces; blue = key results and ordinary work;
   purple = the plan on paper and the planning horizon; red = a problem or a miss; amber = the rule. */
function l13Person(p, x, y, color, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('circle', { cy: -22, r: 16, fill: color }, g);
  path(g, 'M-28 26C-28 0 -14 -4 0 -4C14 -4 28 0 28 26Z', { fill: color, stroke: 'none' });
  return g;
}
const l13Chip = (p, s, x, y, color, t0, w, size = 24) => {
  const g = G(p, { o: 0 }); mk('rect', { x: x - w / 2, y: y - 24, width: w, height: 48, rx: 24, fill: '#16211d', stroke: color, 'stroke-width': 2.5 }, g);
  T(g, s, { x, y: y + 8, size, fill: color, anchor: 'middle' }); show(g, t0); return g;
};
// A tick mark centred on (x, y).
function l13Tick(p, x, y, t0, color = COL.good) {
  const e = path(p, `M${x - 14} ${y}L${x - 4} ${y + 11}L${x + 15} ${y - 12}`, { stroke: color, 'stroke-width': 5 }, { d: 0 });
  draw(e, t0, .3); return e;
}
