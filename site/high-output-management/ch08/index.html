/* Colours: blue = process meetings and ordinary work; purple = mission meetings; green = the goal; red = a problem; amber = the rule. */
function l8Person(p, x, y, color, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('circle', { cy: -22, r: 16, fill: color }, g);
  path(g, 'M-28 26C-28 0 -14 -4 0 -4C14 -4 28 0 28 26Z', { fill: color, stroke: 'none' });
  return g;
}
const l8Chip = (p, s, x, y, color, t0, w, size = 24) => {
  const g = G(p, { o: 0 }); mk('rect', { x: x - w / 2, y: y - 24, width: w, height: 48, rx: 24, fill: '#16211d', stroke: color, 'stroke-width': 2.5 }, g);
  T(g, s, { x, y: y + 8, size, fill: color, anchor: 'middle' }); show(g, t0); return g;
};
function l8Doc(p, x, y, w, h, color, lines, t0) {
  const g = G(p, { o: 0 });
  mk('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 8, fill: '#16211d', stroke: color, 'stroke-width': 3 }, g);
  for (let j = 0; j < lines; j++) mk('rect', { x: x - w / 2 + w * .14, y: y - h / 2 + h * .16 + j * h * .7 / lines, width: w * (j % 3 === 2 ? .45 : .72), height: Math.max(4, h * .04), rx: 2, fill: COL.faint }, g);
  show(g, t0); return g;
}
// A speech bubble whose left edge is at x.
function l8Bubble(p, s, x, y, color, t0) {
  const w = s.length * 12.6 + 44, g = G(p, { o: 0 });
  mk('rect', { x, y: y - 26, width: w, height: 52, rx: 18, fill: '#16211d', stroke: color, 'stroke-width': 2.5 }, g);
  T(g, s, { x: x + 22, y: y + 8, size: 24, fill: color });
  show(g, t0); return g;
}

    hmBox(p, 830, 500, 400, 80, COL.good, m('both'), 'be cautious on expansion', { size: 24, fill: COL.good });
    ['group 1', 'group 2', 'group 3', 'group 4'].forEach((n, i) => {
      const y = 220 + i * 100;
      hmArrow(p, 1036, 500, 1190, y, COL.dim, m('fan', 3 + i * .2), .4);
      hmBox(p, 1300, y, 200, 70, COL.whole, m('fan', 3.3 + i * .2), n, { size: 24 });
    });
    hmSay(p, 'every group Grove supervised', 1300, 640, m('fan', 4.5), { size: 22, fill: COL.dim });
    hmRule(p, 'What a report teaches you can travel to everyone.', m('fan', 7), 750);
  }],

  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    hmSay(p, 'Lesson 8 in five lines', 800, 120, .2, { size: 40, weight: 600 });
    hmWrap(p, [['Meetings are the medium: process or mission.', 'w1'], ['One-on-ones: by task maturity, an hour, in their space.', 'w2'], ['It is their meeting: their outline, their worries.', 'w3'], ['Ask one more question; take notes; keep a hold file.', 'w4'], ['Book the next one as this one ends.', 'w5']], m);
  }],

  ['final1', 'Lesson practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [
    { id: 'p-casual', prompt: ['A peer says scheduled one-on-ones are pointless because she sees her team all day. What would Grove say?'],
      build: choice([['She is right: frequent contact is enough'], ['Passing chats are not a prepared, regular one-on-one'], ['One-on-ones are only needed for poor performers']], 1,
        'A casual encounter, or a meeting about one problem, is very different from a prepared, regular one-on-one.',
        ['Casual contact rarely surfaces what nags people or teaches know-how.', null, 'Their main purpose is mutual teaching, for everyone who reports to you.']) },
    { id: 'p-agenda', prompt: ['Who should prepare the outline for a one-on-one?'],
      build: choice([['You, the manager'], ['The report: it is their meeting'], ['No one: keep it informal']], 1,
        'They prepare once; you would prepare for every report. And it makes them think the issues through.',
        ['You would prepare eight times for eight reports, and the agenda would be yours.', null, 'Without an outline you cannot pace the meeting or see the issues coming.']) },
    { id: 'p-zinger', prompt: ['With five minutes left, your report says she is thinking of leaving. What is the best response?'],
      build: choice([['Promise to deal with it next time'], ['Make time for it now or very soon, and open room for such topics early next time'], ['Remind her the meeting is nearly over']], 1,
        'A zinger needs real time. Act quickly; a valued person thinking of leaving cannot wait two weeks.',
        ['Two weeks may be too late.', null, 'That shuts down exactly the conversation one-on-ones are for.']) },
    { id: 'p-roll', prompt: ['Your one-on-ones are set for every other Wednesday and keep getting cancelled. What is the fix?'],
      build: choice([['Move them to Thursdays'], ['Book each next one at the end of the current one'], ['Hold them only when there is something to discuss']], 1,
        'A rolling schedule works around vacations and commitments, so meetings stop being lost.',
        ['Any fixed slot collides with something eventually.', null, 'That turns a process meeting into an ad hoc one, and the regularity is lost.']) },
    { id: 'p-hold', prompt: ['Your report sends you five small, non-urgent questions by chat every day. Which tool fits?'],
      build: choice([['A hold file for the next one-on-one'], ['Answer each as it arrives'], ['Ask them to stop asking']], 0,
        'Batching non-urgent items into the one-on-one saves you both from constant interruptions.',
        [null, 'That is five interruptions a day.', 'Their questions are legitimate. Channel them instead.']) },
  ], done, 'Lesson practice') }],

  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
boot();
